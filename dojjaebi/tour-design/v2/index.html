<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도째비 길동무</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="v2.css?v=1">
</head><body>
<main id="app">
  <section id="v-home">
    <p class="brand">도째비 길동무</p>
    <h1>동해, 다녀간 사람들에게<br>물어보세요</h1>
    <form id="askForm" autocomplete="off">
      <label for="askIn" class="vh">동해에 대해 궁금한 것</label>
      <textarea id="askIn" rows="2" maxlength="80" placeholder="예) 곰치국 잘하는 데 있어요?"></textarea>
      <button type="submit" class="big">물어보기</button>
    </form>
    <div class="chips" id="chips"></div>
    <h2>사람들이 물어본 것</h2>
    <ul class="list" id="qList"><li class="muted">불러오는 중이에요…</li></ul>
    <p class="note">이용자가 남긴 글을 모아서 보여드려요. 도째비가 가게를 골라 주지 않아요. 영업 여부와 가격은 가시기 전에 꼭 확인하세요. 광고 없음.</p>
  </section>

  <section id="v-ans" hidden>
    <button type="button" class="back" id="back">← 처음으로</button>
    <p class="qq" id="qq"></p>
    <p class="sum" id="sum"></p>
    <h2 id="aHead" hidden>관련은 없지만 최근 올라온 이야기</h2>
    <ul class="list" id="aList"></ul>
    <div class="box" id="askBox">
      <p id="askBoxT"></p>
      <button type="button" class="big sec" id="postQ">이 질문 사랑방에 올리기</button>
    </div>
    <form class="box" id="ansForm" autocomplete="off">
      <label for="ansIn">다녀오셨나요? 한 줄 남겨 주세요</label>
      <input id="ansIn" type="text" maxlength="80" placeholder="예) 12시 전에 가면 바로 앉아요">
      <button type="submit" class="big">남기기</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="note">서로 존중해 주세요. 링크·전화번호·홍보 글은 올릴 수 없어요. 글은 1년간 남아 다른 여행자에게 보여요. 이름은 보이지 않아요.</p>
  </section>
</main>
<script src="../chatfilter.js"></script>
<script src="../places.js"></script>
<script src="rank.js"></script>
<script type="module" src="app.js?v=2"></script>
</body></html>
